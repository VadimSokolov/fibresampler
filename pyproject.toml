[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fibresampler"
version = "0.1.0"
description = "MCMC fibre samplers for count-data linear inverse problems: reflective lattice samplers, change of basis, loading-obstruction escapes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
tuning = ["numba>=0.58"]
helpers = ["sympy>=1.12", "mpmath>=1.3", "networkx>=3.0"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["fibresampler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
